[project]
name = "assist-mcp"
version = "0.1.0"
description = "MCP server exposing California ASSIST (assist.org) articulation agreements — no API key required"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
assist-mcp = "assist_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assist_mcp"]
